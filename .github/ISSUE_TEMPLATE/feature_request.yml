name: Feature request
description: Propose a change or a new feature.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        locksql is a security tool: a feature that loosens a default, adds a way around the console or adds a dependency needs a clear case.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do, and why it is hard today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security impact
      description: How this affects the threat model in docs/security-model.md.
