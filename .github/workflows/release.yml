name: release

# Runs only when a version tag is pushed. Creating the tag (and the first
# push) is a manual, explicit decision.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    name: test before release
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  goreleaser:
    name: goreleaser
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload assets
      id-token: write # cosign keyless signing (GitHub OIDC)
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # changelog needs the full history and tags
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.1
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.54.1
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The image the launcher runs (scripts/locksql): ghcr.io/davidgodefroid/
  # locksql:X.Y.Z and :X.Y.Z-vault, for amd64 and arm64, each built on a
  # native runner, then joined in one manifest per tag and signed with
  # cosign (keyless, by digest). Publishing elsewhere changes this job and
  # the registry line of scripts/locksql only.
  image:
    name: image ${{ matrix.arch }}
    needs: test
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write # push to ghcr.io
    env:
      IMAGE: ghcr.io/davidgodefroid/locksql
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: log in to ghcr.io
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push
        run: |
          v=${GITHUB_REF_NAME#v}
          docker build --build-arg VERSION="$GITHUB_REF_NAME" -t "$IMAGE:$v-${{ matrix.arch }}" .
          docker build --build-arg VERSION="$GITHUB_REF_NAME" --target vault -t "$IMAGE:$v-vault-${{ matrix.arch }}" .
          docker push "$IMAGE:$v-${{ matrix.arch }}"
          docker push "$IMAGE:$v-vault-${{ matrix.arch }}"

  image-manifest:
    name: image manifest
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # cosign keyless signing (GitHub OIDC)
    env:
      IMAGE: ghcr.io/davidgodefroid/locksql
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.1
      - name: log in to ghcr.io
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: manifests, signed
        run: |
          v=${GITHUB_REF_NAME#v}
          for tag in "$v" "$v-vault"; do
            docker buildx imagetools create -t "$IMAGE:$tag" "$IMAGE:$tag-amd64" "$IMAGE:$tag-arm64"
            digest=$(docker buildx imagetools inspect "$IMAGE:$tag" --format '{{json .Manifest.Digest}}' | tr -d '"')
            cosign sign --yes "$IMAGE@$digest"
          done

  # Asks the Homebrew tap (DavidGodefroid/homebrew-tap) to bump the locksql
  # formula to this release, once the archives and the images are published
  # and signed: the tap's bump workflow verifies them with cosign before
  # rewriting the formula. Needs the secret TAP_DISPATCH_TOKEN, a fine-grained
  # token limited to the tap (Contents: read and write); without it the step
  # is skipped. The token is in this job only, which runs no action.
  tap:
    name: homebrew tap
    needs: [goreleaser, image-manifest]
    runs-on: ubuntu-latest
    permissions: {}
    env:
      TAP_DISPATCH_TOKEN: ${{ secrets.TAP_DISPATCH_TOKEN }}
    steps:
      - name: Bump the Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.TAP_DISPATCH_TOKEN }}
        if: ${{ env.TAP_DISPATCH_TOKEN != '' }}
        run: |
          gh api repos/DavidGodefroid/homebrew-tap/dispatches \
            -f event_type=bump \
            -f "client_payload[formula]=locksql" \
            -f "client_payload[version]=${GITHUB_REF_NAME}"
