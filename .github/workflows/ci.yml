name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *" # nightly: fuzzing

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          check-latest: true
      - name: go vet
        run: go vet ./...
      - name: go test
        shell: bash
        run: |
          set -o pipefail
          go test ./... 2>&1 | tee test.log || {
            # Surface the failures as annotations, readable without the logs.
            grep -E -- '--- FAIL|_test\.go:[0-9]+:|^FAIL|panic:' test.log | head -40 | sed 's/^/::error::/'
            exit 1
          }

  # Windows: the module builds and its unit tests run, but locksql itself
  # refuses to run there (docs/usage.md, Windows (WSL2)). Test files that
  # need Unix accounts, file modes, sockets or terminals carry
  # `//go:build unix`; single tests skip with a reason.
  test-windows:
    name: test (windows-latest)
    runs-on: windows-latest
    env:
      CGO_ENABLED: "0"
    steps:
      # Keep LF line endings: fixtures and golden text are compared byte
      # for byte.
      - name: git line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          check-latest: true
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...
      - name: go test
        shell: bash
        run: |
          set -o pipefail
          go test ./... 2>&1 | tee test.log || {
            grep -E -- '--- FAIL|_test\.go:[0-9]+:|^FAIL|panic:' test.log | head -40 | sed 's/^/::error::/'
            exit 1
          }

  lint:
    name: lint (staticcheck, govulncheck, goreleaser check)
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          check-latest: true
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: goreleaser check
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

  # The image of docs/docker.md: it builds, and its separated setup passes
  # locksql doctor from both accounts.
  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -t locksql .
      - name: doctor (agent and console accounts)
        run: |
          docker run --rm -v locksql-run:/run/locksql locksql doctor
          docker run --rm --user locksql -v locksql-run:/run/locksql -v locksql-home:/home/locksql locksql doctor

  # The README's "first query in 3 commands" on a fresh machine: the
  # runner's VM image and fresh Ubuntu and Fedora containers. The test
  # installs the binary, runs locksql setup, starts the console in the
  # console account's own terminal, then an agent plans and runs a SQLite
  # query that the test approves by typing y in the console, as the human
  # would: approval has no other way in. It changes the machine (an account,
  # a group, /usr/local/bin, /etc/locksql), so it runs in CI only.
  first-query:
    name: first query (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target: [runner, "ubuntu:24.04", "fedora:42"]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          check-latest: true
      - name: build locksql and the test
        run: |
          mkdir -p "$RUNNER_TEMP/fq"
          go build -o "$RUNNER_TEMP/fq/locksql" ./cmd/locksql
          go test -c -tags firstquery -o "$RUNNER_TEMP/fq/firstquery.test" ./test/firstquery
      - name: on the runner
        if: matrix.target == 'runner'
        run: |
          cd /tmp
          # The runner exports XDG_*_HOME under /home/runner, which sudo
          # keeps: the console account would read the runner's config. A
          # login session of the console account has none of them.
          unset XDG_CONFIG_HOME XDG_STATE_HOME XDG_CACHE_HOME XDG_DATA_HOME
          LOCKSQL_FIRSTQUERY=1 LOCKSQL_FIRSTQUERY_BIN="$RUNNER_TEMP/fq/locksql" "$RUNNER_TEMP/fq/firstquery.test" -test.v
      - name: in a fresh container
        if: matrix.target != 'runner'
        env:
          IMAGE: ${{ matrix.target }}
        run: |
          docker run --rm -v "$RUNNER_TEMP/fq:/w:ro" "$IMAGE" sh -c '
            set -e
            if command -v apt-get >/dev/null; then
              apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sudo >/dev/null
            else
              dnf install -y -q sudo util-linux util-linux-script shadow-utils >/dev/null
            fi
            useradd -m -s /bin/bash agent
            echo "agent ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/agent
            su agent -c "cd /tmp && LOCKSQL_FIRSTQUERY=1 LOCKSQL_FIRSTQUERY_BIN=/w/locksql /w/firstquery.test -test.v"'

  # Real servers in Docker. The harness in test/integration starts one
  # throwaway container per image (named ls-it-*, port on 127.0.0.1), seeds
  # it through docker exec and removes it when the test binary exits; the
  # images are pulled up front so the pulls run in parallel.
  integration:
    name: integration (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CGO_ENABLED: "0"
      LOCKSQL_IT_MYSQL: mariadb:10.11,mariadb:11.4,mysql:8.0,mysql:8.4
      LOCKSQL_IT_POSTGRES: "13,17"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          check-latest: true
      - name: pull images
        run: |
          pids=""
          for img in mariadb:10.11 mariadb:11.4 mysql:8.0 mysql:8.4 postgres:13 postgres:17; do
            docker pull --quiet "$img" & pids="$pids $!"
          done
          for p in $pids; do wait "$p"; done
      - name: go test -tags integration
        run: go test -tags integration -timeout 30m ./...

  fuzz:
    name: fuzz (nightly)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          check-latest: true
      - name: FuzzLexNoPanic
        run: go test -run '^$' -fuzz '^FuzzLexNoPanic$' -fuzztime 30s ./internal/sqlclass/
      - name: FuzzParseNoPanic (sqlast)
        run: go test -run '^$' -fuzz '^FuzzParseNoPanic$' -fuzztime 60s ./internal/sqlast/
      - name: FuzzAnalyzeNoPanic (sqlast)
        run: go test -run '^$' -fuzz '^FuzzAnalyzeNoPanic$' -fuzztime 120s ./internal/sqlast/
      - name: FuzzParsePlanNoPanic (mysql)
        run: go test -run '^$' -fuzz '^FuzzParsePlanNoPanic$' -fuzztime 30s ./internal/engine/mysql/
      - name: FuzzParsePlanNoPanic (postgres)
        run: go test -run '^$' -fuzz '^FuzzParsePlanNoPanic$' -fuzztime 30s ./internal/engine/postgres/
      - name: FuzzDetectorsNoPanic
        run: go test -run '^$' -fuzz '^FuzzDetectorsNoPanic$' -fuzztime 30s ./internal/pii/
      - name: FuzzAliasViolationNoPanic
        run: go test -run '^$' -fuzz '^FuzzAliasViolationNoPanic$' -fuzztime 30s ./internal/pii/
      - name: FuzzRenderNoPanic
        run: go test -run '^$' -fuzz '^FuzzRenderNoPanic$' -fuzztime 30s ./internal/render/
      - name: FuzzReadMsgNoPanic
        run: go test -run '^$' -fuzz '^FuzzReadMsgNoPanic$' -fuzztime 30s ./internal/ipc/
      - name: FuzzShapeVocabulary
        run: go test -run '^$' -fuzz '^FuzzShapeVocabulary$' -fuzztime 30s ./internal/stats/
