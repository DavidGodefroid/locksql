name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *" # nightly: fuzzing

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          check-latest: true
      - name: go vet
        run: go vet ./...
      - name: go test
        shell: bash
        run: |
          set -o pipefail
          go test ./... 2>&1 | tee test.log || {
            # Surface the failures as annotations, readable without the logs.
            grep -E -- '--- FAIL|_test\.go:[0-9]+:|^FAIL|panic:' test.log | head -40 | sed 's/^/::error::/'
            exit 1
          }

  # Windows: the module builds and its unit tests run, but locksql itself
  # refuses to run there (docs/usage.md, Windows (WSL2)). Test files that
  # need Unix accounts, file modes, sockets or terminals carry
  # `//go:build unix`; single tests skip with a reason.
  test-windows:
    name: test (windows-latest)
    runs-on: windows-latest
    env:
      CGO_ENABLED: "0"
    steps:
      # Keep LF line endings: fixtures and golden text are compared byte
      # for byte.
      - name: git line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          check-latest: true
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...
      - name: go test
        shell: bash
        run: |
          set -o pipefail
          go test ./... 2>&1 | tee test.log || {
            grep -E -- '--- FAIL|_test\.go:[0-9]+:|^FAIL|panic:' test.log | head -40 | sed 's/^/::error::/'
            exit 1
          }

  lint:
    name: lint (staticcheck, govulncheck, goreleaser check)
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          check-latest: true
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: goreleaser check
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: check

  # The image of docs/docker.md: it builds, and its separated setup passes
  # locksql doctor from both accounts.
  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: docker build
        run: docker build -t locksql .
      - name: doctor (agent and console accounts)
        run: |
          docker run --rm -v locksql-run:/run/locksql locksql doctor
          docker run --rm --user locksql -v locksql-run:/run/locksql -v locksql-home:/home/locksql locksql doctor
      - name: the launcher runs every command in the image
        run: |
          set -x
          sh scripts/locksql version | grep -x 'locksql launcher dev (image locksql)'
          mkdir -p "$RUNNER_TEMP/proj" && cd "$RUNNER_TEMP/proj"
          sh "$GITHUB_WORKSPACE/scripts/locksql" init claude
          grep -Eq '"command": ?"locksql"' .mcp.json
          test "$(stat -c %u .mcp.json)" = "$(id -u)"
          sh "$GITHUB_WORKSPACE/scripts/locksql" profile add --profile local --engine sqlite --path app.db
          # Exit 1: the console's checks fail from this container, which runs
          # none (docs/docker.md); the repair itself is checked below.
          code=0; sh "$GITHUB_WORKSPACE/scripts/locksql" doctor --fix --yes || code=$?
          test "$code" = 1
          test "$(stat -c %u .locksql)" = 10001
          code=0; sh "$GITHUB_WORKSPACE/scripts/locksql" status --profile local || code=$?
          test "$code" = 2 # no console is running
          code=0; sh "$GITHUB_WORKSPACE/scripts/locksql" install 2>err || code=$?
          test "$code" = 1 && grep -q 'runs in Docker' err
      - name: docker build with ALLOWED_UIDS
        run: |
          docker build --build-arg ALLOWED_UIDS=4242,4243 -t locksql-allowed .
          docker run --rm --entrypoint cat locksql-allowed /etc/locksql/system.toml | grep -x 'allowed_uids = \[4242,4243\]'
          for bad in '1,,2' '0' '1000,0' '10001' '007' '65534' 'a'; do
            if docker build --build-arg ALLOWED_UIDS="$bad" . >/dev/null 2>&1; then echo "ALLOWED_UIDS=$bad accepted" >&2; exit 1; fi
          done
      - name: docker build --target vault
        run: |
          docker build --target vault -t locksql:vault .
          docker run --rm --user locksql --entrypoint vault locksql:vault version

  # The README's quick start, end to end through the launcher and an image
  # built from this commit: init, profile add, doctor --fix, the console in
  # a terminal, then the agent's plan and run, approved in the console.
  first-query:
    name: first query (launcher)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          check-latest: true
      - name: docker build
        run: docker build -t locksql .
      - name: through the launcher
        run: |
          go test -c -tags firstquery -o "$RUNNER_TEMP/firstquery.test" ./test/firstquery
          cd /tmp
          LOCKSQL_FIRSTQUERY=1 LOCKSQL_FIRSTQUERY_LAUNCHER="$GITHUB_WORKSPACE/scripts/locksql" "$RUNNER_TEMP/firstquery.test" -test.v

  # The launcher of the latest release, installed by its install.sh (cosign
  # signatures of checksums.txt and of the images, checksum), then updated:
  # locksql version and a no-op locksql update. A latest release that
  # predates the launcher has none to install: the job says so and stops.
  update:
    name: update (launcher)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.1
      - name: install.sh, locksql version, locksql update
        run: |
          tag=$(curl -fsSLI -o /dev/null -w '%{url_effective}' https://github.com/DavidGodefroid/locksql/releases/latest)
          tag=${tag##*/}
          echo "latest release: $tag"
          code=0; LOCKSQL_VERSION=$tag sh scripts/install.sh 2>out.txt || code=$?
          cat out.txt
          if [ "$code" != 0 ] && grep -q "holds no launcher" out.txt; then
            echo "::notice::$tag predates the launcher: nothing to update yet"
            exit 0
          fi
          test "$code" = 0
          # install.sh uses sudo only when /usr/local/bin is not writable,
          # which on the runner it is: the launcher is then the runner's.
          test "$(stat -c %a /usr/local/bin/locksql)" = 755
          case "$(stat -c %u /usr/local/bin/locksql)" in 0 | "$(id -u)") ;; *) exit 1 ;; esac
          grep -q '^image_digest=sha256:' /usr/local/bin/locksql
          locksql version | tee version.txt
          grep -q "^locksql launcher ${tag#v} (image ghcr.io/davidgodefroid/locksql@sha256:" version.txt
          grep -qx "locksql ${tag#v}" version.txt || grep -qx "locksql $tag" version.txt
          locksql update "$tag" 2>&1 | tee out.txt
          grep -q "the launcher is already $tag" out.txt

  # Real servers in Docker. The harness in test/integration starts one
  # throwaway container per image (named ls-it-*, port on 127.0.0.1), seeds
  # it through docker exec and removes it when the test binary exits; the
  # images are pulled up front so the pulls run in parallel.
  integration:
    name: integration (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CGO_ENABLED: "0"
      LOCKSQL_IT_MYSQL: mariadb:10.11,mariadb:11.4,mysql:8.0,mysql:8.4
      LOCKSQL_IT_POSTGRES: "13,17"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          check-latest: true
      - name: pull images
        run: |
          pids=""
          for img in mariadb:10.11 mariadb:11.4 mysql:8.0 mysql:8.4 postgres:13 postgres:17; do
            docker pull --quiet "$img" & pids="$pids $!"
          done
          for p in $pids; do wait "$p"; done
      - name: go test -tags integration
        run: go test -tags integration -timeout 30m ./...

  # The approval hub's phase-1 demo (test/integration/hub_e2e_test.go)
  # against lockhub main: plan, pending, lock approve at a terminal, run,
  # audit verify, and the refusals. It must run and pass, not skip.
  hub-phase1:
    name: hub phase 1 (lockhub main)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DavidGodefroid/lockhub
          path: .lockhub-src
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          check-latest: true
      - name: unprivileged user namespaces (the test hides /etc/locksql with unshare)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: docker pull --quiet postgres:17
      - name: TestHubPhase1
        env:
          LOCKHUB_E2E: "1"
        run: |
          set -o pipefail
          LOCKHUB_SRC="$GITHUB_WORKSPACE/.lockhub-src" go test -tags integration -count=1 -timeout 20m -run '^TestHubPhase1$' -v ./test/integration | tee phase1.out
          if grep -q -- '--- SKIP' phase1.out; then echo "a subtest skipped"; exit 1; fi
          grep -q '^--- PASS: TestHubPhase1 ' phase1.out

  fuzz:
    name: fuzz (nightly)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          check-latest: true
      - name: FuzzLexNoPanic
        run: go test -run '^$' -fuzz '^FuzzLexNoPanic$' -fuzztime 30s ./internal/sqlclass/
      - name: FuzzParseNoPanic (sqlast)
        run: go test -run '^$' -fuzz '^FuzzParseNoPanic$' -fuzztime 60s ./internal/sqlast/
      - name: FuzzAnalyzeNoPanic (sqlast)
        run: go test -run '^$' -fuzz '^FuzzAnalyzeNoPanic$' -fuzztime 120s ./internal/sqlast/
      - name: FuzzParsePlanNoPanic (mysql)
        run: go test -run '^$' -fuzz '^FuzzParsePlanNoPanic$' -fuzztime 30s ./internal/engine/mysql/
      - name: FuzzParsePlanNoPanic (postgres)
        run: go test -run '^$' -fuzz '^FuzzParsePlanNoPanic$' -fuzztime 30s ./internal/engine/postgres/
      - name: FuzzAliasViolationNoPanic
        run: go test -run '^$' -fuzz '^FuzzAliasViolationNoPanic$' -fuzztime 30s ./internal/pii/
      - name: FuzzRenderNoPanic
        run: go test -run '^$' -fuzz '^FuzzRenderNoPanic$' -fuzztime 30s ./internal/render/
      - name: FuzzShapeVocabulary
        run: go test -run '^$' -fuzz '^FuzzShapeVocabulary$' -fuzztime 30s ./internal/stats/
