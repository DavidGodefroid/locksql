<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="locksql logo">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="shackle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
  </defs>
  <!-- shackle -->
  <path d="M42 56 V38 a22 22 0 0 1 44 0 V56" fill="none" stroke="url(#shackle)" stroke-width="11" stroke-linecap="round"/>
  <!-- database cylinder = lock body -->
  <path d="M24 56 V102 a40 11 0 0 0 80 0 V56 Z" fill="url(#body)"/>
  <path d="M24 79 a40 11 0 0 0 80 0" fill="none" stroke="#C4B5FD" stroke-opacity=".45" stroke-width="2.5"/>
  <ellipse cx="64" cy="56" rx="40" ry="11" fill="url(#top)"/>
  <!-- keyhole -->
  <circle cx="64" cy="88" r="7" fill="#0F172A"/>
  <path d="M60.5 91 L58.5 104 H69.5 L67.5 91 Z" fill="#0F172A"/>
</svg>
