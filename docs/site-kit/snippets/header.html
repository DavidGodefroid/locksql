<!-- header.html: right after <body>. Same nav, same order, on every Lock site:
     Home · Install · How it works · Security · FAQ · GitHub. Put
     aria-current="page" on the current page's link and drop the data-nav
     attributes. {{ROOT}} as in head.html; {{HOME}} is "./" on the home page,
     else {{ROOT}} ("/" on 404.html). The logo is the Lock's family logo
     (lockfamily assets/<lock>.svg, or assets/mark.svg when it has none). -->
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="{{HOME}}"><img src="{{ROOT}}assets/logo.svg" alt="" width="32" height="32"><span class="wordmark">{{LOCK}}</span></a>
      <nav class="site-nav" aria-label="Main">
        <ul>
          <li><a href="{{HOME}}" data-nav="home">Home</a></li>
          <li><a href="{{ROOT}}install/" data-nav="install">Install</a></li>
          <li><a href="{{ROOT}}how-it-works/" data-nav="how">How it works</a></li>
          <li><a href="{{ROOT}}security/" data-nav="security">Security</a></li>
          <li><a href="{{ROOT}}faq/" data-nav="faq">FAQ</a></li>
          <li><a href="https://github.com/DavidGodefroid/{{LOCK}}">GitHub</a></li>
        </ul>
      </nav>
    </div>
  </header>
