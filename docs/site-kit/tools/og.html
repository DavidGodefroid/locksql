<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="assets/tokens.css"><link rel="stylesheet" href="assets/lock-site.css">
<style>
body{margin:0;width:1200px;height:630px;overflow:hidden}
.og{box-sizing:border-box;width:1200px;height:630px;padding:64px 72px;display:grid;grid-template-columns:260px 1fr;gap:56px;align-items:center;border:2px solid var(--ink)}
.og img{width:260px;height:260px}
.og .lab{font:600 22px/1.4 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin:0 0 12px}
.og h1{font-size:118px;margin:0 0 14px;line-height:1}
.og p.t{font:400 40px/1.3 var(--font-text);margin:0;max-width:24ch}
.og p.t span{color:var(--sign)}
.og .foot{grid-column:1/-1;border-top:2px dashed var(--rule);padding-top:22px;font:600 22px var(--font-mono);color:var(--ink-2);display:flex;justify-content:space-between}
.icon{width:180px;height:180px;display:grid;place-items:center;background:var(--card)}
.icon img{width:150px;height:150px}
</style></head><body>
<div class="og"><img src="assets/logo.svg" alt=""><div><p class="lab">A Lock of the Lock Family</p><h1>{{LOCK}}</h1><p class="t">{{TAGLINE_FIRST}} <span>{{TAGLINE_KEY}}</span></p></div>
<div class="foot"><span>{{SOURCES}}</span><span>lockfamily.dev</span></div></div>
</body></html>
