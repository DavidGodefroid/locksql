# GoReleaser configuration for locksql.
#
# Local dry run (no signing, no publishing):
#   goreleaser check
#   goreleaser release --snapshot --clean --skip=sign
#
# A tag v* pushed to GitHub runs .github/workflows/release.yml, which needs
# cosign and syft on PATH.
version: 2

project_name: locksql

before:
  hooks:
    - go mod download

builds:
  - id: locksql
    main: ./cmd/locksql
    binary: locksql
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: locksql
    ids: [locksql]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # Explicit list: docs/ also holds local-only material that must never ship.
    # scripts/locksql is the host launcher that scripts/install.sh and
    # `locksql update` install; the binary is the one of an agent that runs in
    # a container of its own (docs/docker.md).
    files:
      - src: scripts/locksql
        info:
          mode: 0755
      - LICENSE
      - NOTICE
      - README.md
      - SECURITY.md
      - docs/usage.md
      - docs/security-model.md

# No Linux packages: locksql runs in Docker, and the host gets only the
# launcher (scripts/install.sh). The image is published by the image job of
# .github/workflows/release.yml.

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Keyless cosign signature of the checksum file (GitHub OIDC in CI). Verify
# with:
#   cosign verify-blob --bundle checksums.txt.sigstore.json \
#     --certificate-identity-regexp '^https://github\.com/DavidGodefroid/locksql/\.github/workflows/release\.yml@refs/tags/v[0-9]' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     checksums.txt
signs:
  - id: cosign
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --bundle=${signature}
      - --yes
      - ${artifact}
    output: true

# One SPDX SBOM per archive, generated by syft.
sboms:
  - id: archives
    artifacts: archive

changelog:
  sort: asc
  use: git
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: DavidGodefroid
    name: locksql
  prerelease: auto
  draft: false
