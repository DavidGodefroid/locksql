# GoReleaser configuration for locksql.
#
# Local dry run (no signing, no publishing):
#   goreleaser check
#   goreleaser release --snapshot --clean --skip=sign
#
# A tag v* pushed to GitHub runs .github/workflows/release.yml, which needs
# cosign and syft on PATH and the secret HOMEBREW_TAP_GITHUB_TOKEN (a
# fine-grained token with contents:write on DavidGodefroid/homebrew-tap).
version: 2

project_name: locksql

before:
  hooks:
    - go mod download

builds:
  - id: locksql
    main: ./cmd/locksql
    binary: locksql
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: locksql
    ids: [locksql]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # Explicit list: docs/ also holds local-only material that must never ship.
    files:
      - LICENSE
      - NOTICE
      - README.md
      - SECURITY.md
      - docs/usage.md
      - docs/security-model.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Keyless cosign signature of the checksum file (GitHub OIDC in CI). Verify
# with:
#   cosign verify-blob --bundle checksums.txt.sigstore.json \
#     --certificate-identity-regexp 'https://github.com/DavidGodefroid/locksql/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     checksums.txt
signs:
  - id: cosign
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --bundle=${signature}
      - --yes
      - ${artifact}
    output: true

# One SPDX SBOM per archive, generated by syft.
sboms:
  - id: archives
    artifacts: archive

changelog:
  sort: asc
  use: git
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: DavidGodefroid
    name: locksql
  prerelease: auto
  draft: false

# Homebrew: a cask in DavidGodefroid/homebrew-tap (the "brews" formula pipe is
# deprecated in GoReleaser v2). Pre-releases are not published.
homebrew_casks:
  - name: locksql
    ids: [locksql]
    binaries: [locksql]
    repository:
      owner: DavidGodefroid
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://github.com/DavidGodefroid/locksql
    description: Human-gated database access for AI agents
    license: Apache-2.0
    commit_author:
      name: David Godefroid
      email: noreply@github.com
    commit_msg_template: "locksql {{ .Tag }}"
    skip_upload: auto
    hooks:
      post:
        # The binaries are not notarised: drop the quarantine attribute.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/locksql"]
          end
